[project]
name = "driver-harness-mcp"
version = "0.1.0"
description = "High-level MCP tools that orchestrate VMware, VirtualKD, and self-hosted WinDbg MCP for Windows kernel driver testing."
authors = [{ name = "Letenz" }]
license = { text = "MIT" }
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.5.0",
    "pywin32>=305; sys_platform == 'win32'",
    "pydantic>=2.0,<2.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
driver-harness-mcp = "driver_harness_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driver_harness_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
